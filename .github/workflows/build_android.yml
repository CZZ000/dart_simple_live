name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Check Flutter version
        run: |
          flutter --version
          dart --version
      
      - name: Get simple_live_core dependencies first
        run: |
          cd simple_live_core
          dart pub get
      
      - name: Get app dependencies
        run: |
          cd simple_live_app
          flutter pub get
      
      - name: Install Android SDK and Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      
      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses
      
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      
      - name: Upload to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd simple_live_app
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Uploading to release: $VERSION"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "Uploading: $apk"
            gh release upload "$VERSION" "$apk" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
