name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      
      - name: Setup Flutter 3.38.x (beta)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true
      
      - name: Get app dependencies
        run: |
          cd simple_live_app
          flutter pub get
          echo "✅ deps OK"
      
      - name: Show Flutter/Dart versions
        run: |
          flutter --version
          dart --version
      
      - name: Build APK (split per ABI)
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi
          ls -la build/app/outputs/flutter-apk/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30
      
      - name: Upload to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd simple_live_app
          VERSION=${GITHUB_REF#refs/tags/}
          for apk in build/app/outputs/flutter-apk/app-*.apk; do
            echo "Uploading: $apk"
            gh release upload "$VERSION" "$apk" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
