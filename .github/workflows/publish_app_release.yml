name: app-build-action
#推送Tag时触发
on:
  push:
    tags:
      - "v*"
jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      #签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      #设置JAVA环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      #设置Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          cache: true

      #更新Flutter的packages
      - name: Restore packages
        timeout-minutes: 10
        run: |
          cd simple_live_app
          flutter pub get

      #接受Android许可证
      - name: Accept Android licenses
        timeout-minutes: 5
        run: |
          yes | flutter doctor --android-licenses

      #检查Gradle版本
      - name: Check Gradle
        run: |
          echo "Gradle wrapper properties:"
          cat simple_live_app/android/gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "Flutter version:"
          flutter --version
          echo ""
          echo "Java version:"
          java -version

      #APK签名设置（可选，如果设置了secrets则使用签名）
      - name: Check Android keystore
        id: check_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "No keystore found, will build unsigned APK"
          fi

      - name: Download Android keystore
        if: steps.check_keystore.outputs.has_keystore == 'true'
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create key.properties
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      #打包APK
      - name: Build APK
        timeout-minutes: 20
        run: |
          cd simple_live_app
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/

      #上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      #获取版本信息
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      #列出所有APK文件（用于调试）
      - name: List APK files
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "APK files in build directory:"
          find simple_live_app/build -name "*.apk" -type f
          ls -la simple_live_app/build/app/outputs/flutter-apk/

      #发布Release
      - name: Publish Android APK to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd simple_live_app
          echo "Listing APK files..."
          ls -la build/app/outputs/flutter-apk/
          echo "Uploading APK to release..."
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "Uploading: $apk"
            gh release upload ${{ steps.version.outputs.VERSION }} "$apk" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #完成
      - run: echo "🤖 Android job's status is ${{ job.status }}."

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      # 安装依赖
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install Dependencies
        run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      # 打开Linux Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop
      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get --verbose 2>&1 | tail -30
      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # build Linux ZIP
      - name: Build Linux
        run: |
          cd simple_live_app
          flutter_distributor package --platform linux --targets zip --skip-clean
      # 上传Linux包至Artifacts
      - name: Upload Linux APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            simple_live_app/build/dist/*/*.zip

      #获取版本信息
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      #发布Release
      - name: Publish Linux to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd simple_live_app
          echo "Listing zip files..."
          find build/dist -name "*.zip" -type f
          for zip in $(find build/dist -name "*.zip" -type f); do
            echo "Uploading: $zip"
            gh release upload ${{ steps.version.outputs.VERSION }} "$zip" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #完成
      - run: echo "🐧 Linux job's status is ${{ job.status }}."

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          cache: true
      # 打开Windows Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get --verbose 2>&1 | tail -30
      # 构建Windows应用
      - name: Build Windows
        timeout-minutes: 30
        shell: pwsh
        run: |
          cd simple_live_app
          Write-Host "=== Flutter info ==="
          flutter --version
          flutter config --list
          Write-Host "=== Cleaning ==="
          flutter clean
          Write-Host "=== Getting packages ==="
          flutter pub get --verbose 2>&1 | tail -20
          Write-Host "=== Building Windows ==="
          flutter build windows --release --verbose 2>&1 | tail -50
          Write-Host "=== Build completed ==="
          Write-Host "Checking build output..."
          if (Test-Path "build\windows\x64\runner\Release") {
            Get-ChildItem -Path "build\windows\x64\runner\Release" -Recurse | Select-Object FullName
          } else {
            Write-Host "ERROR: Build output not found!"
            exit 1
          }
      # 打包为ZIP
      - name: Package Windows
        timeout-minutes: 10
        shell: pwsh
        run: |
          cd simple_live_app
          $BuildDir = "build\windows\x64\runner\Release"
          $DistDir = "build\dist"
          $ZipPath = "$DistDir\simple_live_app-windows.zip"
          
          Write-Host "Checking build output..."
          if (Test-Path $BuildDir) {
            Write-Host "Build directory exists: $BuildDir"
            Get-ChildItem $BuildDir | Select-Object Name
          } else {
            Write-Host "ERROR: Build directory not found: $BuildDir"
            exit 1
          }
          
          if (!(Test-Path $DistDir)) { 
            New-Item -ItemType Directory -Path $DistDir -Force | Out-Null
          }
          
          Write-Host "Creating ZIP archive..."
          Compress-Archive -Path "$BuildDir\*" -DestinationPath $ZipPath -Force
          Write-Host "ZIP created: $ZipPath"
          $zipSize = (Get-Item $ZipPath).Length / 1MB
          Write-Host "ZIP size: $([math]::Round($zipSize, 2)) MB"
      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: simple_live_app/build/dist/simple_live_app-windows.zip
          retention-days: 30

      #获取版本信息
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      #发布Release
      - name: Publish Windows to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd simple_live_app
          echo "Uploading Windows artifact..."
          ls -la build/dist/simple_live_app-windows.zip
          gh release upload ${{ steps.version.outputs.VERSION }} build/dist/simple_live_app-windows.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #完成
      - run: echo "🪟 Windows job's status is ${{ job.status }}."

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      #签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      #设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      #设置JAVA环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # 打开MAC Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      #更新Flutter的packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 安装appdmg npm install -g appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      # 打包MAC
      - name: Build MacOS
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      # 上传MAC至Artifacts
      - name: Upload MacOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      #获取版本信息
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      #发布Release
      - name: Publish Mac to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd simple_live_app
          echo "Listing macOS artifacts..."
          find build/dist -name "*.dmg" -o -name "*.zip" | grep -v "\.zip$" || true
          find build/dist -name "*.dmg" -type f
          find build/dist -name "*.zip" -type f
          for f in build/dist/*/*.dmg build/dist/*/*.zip; do
            [ -f "$f" ] || continue
            echo "Uploading: $f"
            gh release upload ${{ steps.version.outputs.VERSION }} "$f" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #完成
      - run: echo "🍏 Mac job's status is ${{ job.status }}."
